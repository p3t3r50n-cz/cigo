#cloud-config
#
# LAMP on Ubuntu 22.04 with PHP 8.0 from the Ondrej PHP PPA.
# Bootstrap: cloud-init (packages, files, services).
# Pipeline: cigo: actions run on every invocation, including re-deploys.
#
# Override the PHP version from the command line:
#   ./cigo.sh create --name lamp-test --template templates/lamp-p80-u22 \
#     --var PHP_VERSION=8.0
#

cigo: image ubuntu:22.04
cigo: profile default

cigo: var PHP_VERSION=8.0

cigo: config limits.memory=2GiB
cigo: config limits.cpu=2
cigo: config security.nesting=true

cigo: timeout 1800

# --- bootstrap (first boot only) ---------------------------------------------

package_update: true
package_upgrade: true

# Trust forwarded client addresses only from the LXD bridge gateway.
write_files:
  - path: /etc/apache2/conf-available/remoteip.conf
    permissions: '0644'
    content: |
      RemoteIPHeader X-Forwarded-For
      RemoteIPTrustedProxy %cigo.gateway%

# --- pipeline (every invocation, in declaration order) -----------------------

# 1) Tools required to add the package repository.
cigo: packages software-properties-common ca-certificates curl

# 2) Add the Ondrej PHP PPA; repeated runs are safe.
cigo: run add-apt-repository -y ppa:ondrej/php
cigo: run apt-get update -qq

# 3) Apache and the selected PHP version.
cigo: packages apache2 libapache2-mod-php%PHP_VERSION% php%PHP_VERSION%-cli php%PHP_VERSION%-common php%PHP_VERSION%-curl php%PHP_VERSION%-gd php%PHP_VERSION%-mbstring php%PHP_VERSION%-mysql php%PHP_VERSION%-opcache php%PHP_VERSION%-readline php%PHP_VERSION%-xml php%PHP_VERSION%-zip

# 4) Apache modules and configuration.
cigo: run a2enmod rewrite remoteip
cigo: run a2enconf remoteip

# 5) Install Composer from its official source after verifying its SHA-384.
cigo: run sh -c 'set -e; d=$(mktemp -d); cd "$d"; curl -fsSL https://composer.github.io/installer.sig -o i.sig; curl -fsSL https://getcomposer.org/installer -o c.php; [ "$(cat i.sig)" = "$(php -r "echo hash_file(\"sha384\",\"c.php\");")" ] || { echo "SHA384 mismatch" >&2; exit 1; }; php c.php --quiet --install-dir=/usr/local/bin --filename=composer; cd /; rm -rf "$d"; composer --version'

# 6) Enable and restart Apache.
cigo: run systemctl enable apache2
cigo: run systemctl restart apache2
